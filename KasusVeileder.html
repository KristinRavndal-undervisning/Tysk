  .score-card { background: white; border: 1.5px solid var(--blue-light); border-radius: 8px; padding: 0.5rem 1rem; font-size: 13px; color: var(--gray-600); flex: 1; min-width: 120px; }

  table.kasus-table td:last-child { border-right: none; }
  table.kasus-table td.kasus-label { font-size: 13px; font-weight: 600; color: var(--blue-dark); padding: 10px 12px; background: var(--blue-light); text-align: left; border-right: 1.5px solid var(--blue-mid); }

  button.art-btn.correct-flash { background: var(--green-light); color: var(--green-dark); }

  table.poss-list { border-collapse: collapse; font-size: 14px; }
  table.poss-list td { padding: 7px 12px; border-bottom: 1px solid rgba(59,130,246,0.15); white-space: nowrap; }
  table.poss-list td:last-child { border-bottom: none; }
  table.poss-list tr:last-child td { border-bottom: none; }
  table.poss-list td.poss-pronoun { color: var(--gray-400); font-size: 13px; padding-right: 6px; background: var(--gray-50); border-right: 1px solid rgba(59,130,246,0.15); }
  table.poss-list td.poss-word { font-weight: 600; }

  .poss-table-wrap { flex: 1; border: 1.5px solid var(--blue-mid); border-radius: 8px; overflow: hidden; }
  .poss-table-placeholder { color: var(--gray-400); font-size: 14px; padding: 1rem 0; font-style: italic; }
  @media print { .bottom-bar, .btn-row button { display: none !important; } }
</style>
</head>

// For each row: endings by [kasus][gender]
// nom: m="", f="e", n="", pl="e"
// akk: m="en", f="e", n="", pl="e"
// dat: m="em", f="er", n="em", pl="en"
// Special: euer stem="eu", so nom-m = "euer", nom-f = "eure" etc.
function getPossForm(stem, kasus, gender) {
  const endings = {
    nom: {m:"",   f:"e",  n:"",   pl:"e"},
    akk: {m:"en", f:"e",  n:"",   pl:"e"},
    dat: {m:"em", f:"er", n:"em", pl:"en"},
  };
  const ending = endings[kasus][gender];
  // euer special: stem "eu" + "er" for base, drop the e before consonant endings
  if (stem === "eu") {
    // euer, eure, euer, eure / euren, eure, euer, eure / eurem, eurer, eurem, euren
    const euForms = {
      nom: {m:"euer", f:"eure",  n:"euer",  pl:"eure"},
      akk: {m:"euren",f:"eure",  n:"euer",  pl:"eure"},
      dat: {m:"eurem",f:"eurer", n:"eurem", pl:"euren"},
    };
    return euForms[kasus][gender];
  }
  return stem + ending;
}

let queue=[], qi=0, totalPoints=0, firstTryCount=0, doneCount=0, sentencePoints=[];
let hintShown=false, usedShowAnswer=false, answered=false, overviewVisible=false;

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function fmtPts(p){const s=p.toFixed(1);if(s.endsWith('.0'))return s.slice(0,-2);if(s==='0.5')return '\u00bd';if(s.endsWith('.5'))return s.slice(0,-2)+'\u00bd';return s;}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function sentenceWithUnderline(s){
  const bl=s.blank.toLowerCase(); let done=false;
  return s.de.split(' ').map(w=>{
    if(!done){const punct=w.match(/[.,!?]$/)?w.slice(-1):'';const core=punct?w.slice(0,-1):w;
      if(core.toLowerCase()===bl){done=true;return '<span class="ov-underline">'+esc(core)+'</span>'+esc(punct);}}
    return esc(w);
  }).join(' ');
}

function updateScorebar(){
  const TOTAL=MODULES[currentModule].sentences.length;
  document.getElementById('sc-total').textContent=fmtPts(totalPoints);
  document.getElementById('sc-first').textContent=firstTryCount;
  document.getElementById('sc-done').textContent=doneCount+' / '+TOTAL;
}

function clearTableHighlights(){document.querySelectorAll('.art-btn').forEach(b=>b.classList.remove('selected-wrong','correct-flash'));}
function getBtn(g,k,pronKey){
  if(currentModule==='pron')
    return document.querySelector('.art-btn[data-pronkey="'+pronKey+'"][data-kasus="'+k+'"]');
  return document.querySelector('.art-btn[data-gender="'+g+'"][data-kasus="'+k+'"]');
}

function showFeedback(type,html){
  const cls=type==='correct'?'correct-msg':type==='hint'?'hint':'wrong-msg';
  document.getElementById('feedback-area').innerHTML='<div class="'+cls+'">'+html+'</div>';
}

function attachTableListeners(){
  document.querySelectorAll('.art-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{if(answered)return;handleAnswer(btn.dataset.gender,btn.dataset.kasus,btn,queue[qi]);});
  });
}


// ── POSSESSIVE MODULE LOGIC ───────────────────────────────────────────────────

function buildPossTable(stem) {
  const rows = ['nom','akk','dat'];
  const cols = ['m','f','n','pl'];
  const colLabels = ['Hankjønn','Hunkjønn','Intetkjønn','Flertall'];
  let html = '<table class="kasus-table" id="kasus-table"><thead><tr>' +
    '<th class="row-header"></th>';
  colLabels.forEach(l => html += '<th>'+l+'</th>');
  html += '</tr></thead><tbody>';
  rows.forEach(k => {
    const kLabel = {nom:'Nominativ',akk:'Akkusativ',dat:'Dativ'}[k];
    html += '<tr><td class="kasus-label">'+kLabel+'</td>';
    cols.forEach(g => {
      const form = getPossForm(stem, k, g);
      html += '<td><button class="art-btn" data-gender="'+g+'" data-kasus="'+k+'">'+form+'</button></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function buildPossList(activeIdx) {
  let html = '<table class="poss-list">';
  POSSESSIVE_ROWS.forEach((row, i) => {
    const isActive = i === activeIdx;
    const wordClass = isActive ? ' poss-correct' : '';
    html += '<tr>' +
      '<td class="poss-pronoun">'+row.pronoun+'</td>' +
      '<td class="poss-word'+wordClass+'">'+row.word+'</td>' +
      '</tr>';
  });
  html += '</table>';
  return html;
}

function renderPossQuestion(s, reveal) {
  const parts = s.de.split(s.blank);
  // Longest match first to avoid partial hits (e.g. 'vår' inside 'våre')
  const noPosForms = ['Deres','deres','våre','vårt','vår','sine','dine','mine','hans','hennes','dens','sitt','ditt','mitt','sin','din','min'];
  let noHtml = esc(s.no);
  for (const form of noPosForms) {
    if (s.no.indexOf(form) !== -1) {
      // Replace only if it appears as a standalone word (surrounded by non-letters)
      const escaped = form.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('(?<![a-zA-Z\u00c0-\u017e])(' + escaped + ')(?![a-zA-Z\u00c0-\u017e])', 'u');
      if (re.test(s.no)) {
        noHtml = esc(s.no).replace(re, '<em><strong>$1</strong></em>');
        break;
      }
    }
  }
  document.getElementById('sentence-area').innerHTML =
    '<span style="color:#6b7280;font-size:14px;display:block;margin-bottom:4px">'+noHtml+'</span>' +
    esc(parts[0]) + '<span class="blank">' + (reveal ? s.blank : '&nbsp;&nbsp;&nbsp;&nbsp;') + '</span>' +
    esc(parts.slice(1).join(s.blank));
}

function attachPossTableListeners(s) {
  document.querySelectorAll('.art-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      handleAnswer(btn.dataset.gender, btn.dataset.kasus, btn, s);
    });
  });
}



function generatePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const modLabel = currentModule==='bestemt'?'Bestemt artikkel'
    :currentModule==='ubestemt'?'Ubestemt artikkel'
    :currentModule==='kein'?'kein'
    :currentModule==='poss'?'Eiendomsord'
    :'Personlige pronomen';
  const TOTAL = MODULES[currentModule].sentences.length;
  // Header
  doc.setFontSize(20);
  doc.setFont('helvetica','bold');
  doc.text('KasusVeileder', 14, 20);

  doc.setFontSize(12);
  doc.setFont('helvetica','normal');
  doc.text('Modul: ' + modLabel, 14, 30);
  doc.text('Dato: ' + new Date().toLocaleDateString('no-NO'), 14, 38);

  // Score box
  doc.setFontSize(11);
  doc.setFont('helvetica','bold');
  doc.text('Resultat', 14, 50);
  doc.setFont('helvetica','normal');
  doc.text('Poeng totalt: ' + fmtPts(totalPoints) + ' / ' + TOTAL, 14, 58);
  doc.text('Riktige p\u00e5 f\u00f8rste fors\u00f8k: ' + firstTryCount + ' av ' + doneCount, 14, 66);
  doc.text('Fullf\u00f8rt: ' + doneCount + ' av ' + TOTAL, 14, 74);

  // Table of sentences
  const rows = queue.slice(0, doneCount).map(s => [
    s.no,
    currentModule==='pron' ? '' : (GENDER_LABEL[s.gender] || ''),
    KASUS_LABEL[s.kasus],
    s.role,
  ]);

  const cols = currentModule==='pron'
    ? ['Setning', 'Kasus', 'Setningsledd', 'Poeng']
    : ['Setning', 'Kj\u00f8nn', 'Kasus', 'Setningsledd', 'Poeng'];

  const tableRows = currentModule==='pron'
    ? queue.slice(0,doneCount).map((s,i)=>[s.no, KASUS_LABEL[s.kasus], s.role, fmtPts(sentencePoints[i]||0)])
    : queue.slice(0,doneCount).map((s,i)=>[s.no, GENDER_LABEL[s.gender]||'', KASUS_LABEL[s.kasus], s.role, fmtPts(sentencePoints[i]||0)]);

  doc.autoTable({
    startY: 82,
    head: [cols],
    body: tableRows,
    styles: { fontSize: 9, cellPadding: 3 },
    headStyles: { fillColor: [59, 130, 246], textColor: 255, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [245, 247, 255] },
    columnStyles: currentModule==='pron'
      ? { 0: {cellWidth: 90}, 1: {cellWidth: 28}, 2: {cellWidth: 44}, 3: {cellWidth: 18} }
      : { 0: {cellWidth: 72}, 1: {cellWidth: 24}, 2: {cellWidth: 24}, 3: {cellWidth: 42}, 4: {cellWidth: 18} },
    margin: { left: 14, right: 14 },
  });

  doc.save('KasusVeileder_' + modLabel.replace(/ /g,'_') + '.pdf');
}

function loadModule(modKey){
  currentModule=modKey;
  const mod=MODULES[modKey];
  overviewVisible=false;
  document.getElementById('overview-container').innerHTML='';
  document.getElementById('subtitle-text').innerHTML=mod.subtitleHTML;
  if(modKey !== 'poss'){
    document.getElementById('table-wrap').innerHTML=mod.tableHTML();
    attachTableListeners();
  } else {
    document.getElementById('table-wrap').innerHTML='';
  }
  queue=shuffle(mod.sentences);
  qi=0; totalPoints=0; firstTryCount=0; doneCount=0; sentencePoints=[];
  updateScorebar();
  loadQuestion();
}

function loadQuestion(){
  if(qi>=queue.length){showDone();return;}
  const s=queue[qi];
  hintShown=false; usedShowAnswer=false; answered=false;
  clearTableHighlights();
  document.getElementById('progress-lbl').textContent='Setning '+(qi+1)+' av '+MODULES[currentModule].sentences.length;
  document.getElementById('feedback-area').innerHTML='';
  document.getElementById('btn-row').innerHTML='';
  if(currentModule==='poss'){
    renderPossQuestion(s,false);
    document.getElementById('table-wrap').innerHTML=
      '<div class="poss-layout">'+
        '<div class="poss-list-wrap">'+buildPossList(s.poss_pronoun_idx)+'</div>'+
        '<div class="poss-table-wrap">'+buildPossTable(s.poss_stem)+'</div>'+
      '</div>';
    attachPossTableListeners(s);
  } else {
    renderSentence(s,false);
  }
}

function renderSentence(s,reveal){
  const parts=s.de.split(s.blank);
  let noHtml = esc(s.no);
  if(currentModule==='pron'){
    // Highlight the Norwegian pronoun corresponding to the blank
    const noPronMap = {
      ich:{nom:'jeg',akk:'meg',dat:'meg'},
      du:{nom:'du',akk:'deg',dat:'deg'},
      er:{nom:'han',akk:'ham',dat:'ham'},
      sie_sg:{nom:'hun',akk:'henne',dat:'henne'},
      es:{nom:'det',akk:'det',dat:'ham'},
      wir:{nom:'vi',akk:'oss',dat:'oss'},
      ihr_pl:{nom:'dere',akk:'dere',dat:'dere'},
      sie_pl:{nom:'de',akk:'dem',dat:'dem'},
      Sie:{nom:'De',akk:'Dem',dat:'Dem'},
    };
    const noForm = noPronMap[s.pronKey] && noPronMap[s.pronKey][s.kasus];
    if(noForm){
      const re = new RegExp('(?<![a-zA-Z\u00c0-\u017e])('+noForm+')(?![a-zA-Z\u00c0-\u017e])','u');
      noHtml = esc(s.no).replace(re,'<em><strong>$1</strong></em>');
    }
  }
  document.getElementById('sentence-area').innerHTML=
    '<span style="color:#6b7280;font-size:14px;display:block;margin-bottom:4px">'+noHtml+'</span>'
    +esc(parts[0])+'<span class="blank">'+(reveal?s.blank:'&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>'+esc(parts.slice(1).join(s.blank));
}

function handleAnswer(g,k,btn,s){
  const correct = currentModule==='pron'
    ? (btn.dataset.pronkey===s.pronKey && k===s.kasus)
    : (g===s.gender && k===s.kasus);
  if(correct){markCorrect(btn,s,false);return;}
  btn.classList.add('selected-wrong');
  if(!hintShown){
    if(currentModule==='pron'){
      showFeedback('hint',
        '\u00ab' + s.blank + '\u00bb er ' + s.role + ' i setningen \u2192 ' + KASUS_LABEL[s.kasus] + '.'
      );
    } else {
      showFeedback('hint',s.genderHint+'<br>\u00ab'+s.nounPhrase+'\u00bb er '+s.role+' \u2192 '+KASUS_LABEL[s.kasus]+'.');
    }
    hintShown=true; maybeShowAnswerBtn(s);
  }
}

function maybeShowAnswerBtn(s){
  if(!document.getElementById('show-ans-btn')){
    const b=document.createElement('button');
    b.className='show-answer-btn'; b.id='show-ans-btn'; b.textContent='Se svar';
    b.addEventListener('click',()=>{usedShowAnswer=true; markCorrect(getBtn(s.gender,s.kasus,s.pronKey),s,true);});
    document.getElementById('btn-row').appendChild(b);
  }
}

function markCorrect(btn,s,forced){
  answered=true; clearTableHighlights(); btn.classList.add('correct-flash');
  const firstTry=!forced&&!usedShowAnswer&&!hintShown;
  const pts=forced||usedShowAnswer?0:hintShown?0.5:1;
  totalPoints+=pts; if(firstTry)firstTryCount++; doneCount++; sentencePoints.push(pts);
  updateScorebar();
  if(currentModule==='poss') renderPossQuestion(s,true); else renderSentence(s,true);
  let feedMsg, feedMsgOk;
  if(currentModule==='pron'){
    feedMsg = '<strong>Svaret er:</strong> <em>'+s.blank+'</em> \u2013 '+s.role+' \u2192 '+KASUS_LABEL[s.kasus]+'.';
    feedMsgOk = '\u2713 '+s.role+' \u2192 '+KASUS_LABEL[s.kasus]+'. <strong>+'+(pts===1?'1':'0,5')+' poeng</strong>';
  } else {
    const gl=GENDER_LABEL[s.gender]; const glCap=gl[0].toUpperCase()+gl.slice(1);
    feedMsg = '<strong>Svaret er:</strong> <em>'+s.blank+'</em> \u2013 '+gl+', '+s.role+' \u2192 '+KASUS_LABEL[s.kasus]+'.';
    feedMsgOk = '\u2713 '+glCap+', '+s.role+' \u2192 '+KASUS_LABEL[s.kasus]+'. <strong>+'+(pts===1?'1':'0,5')+' poeng</strong>';
  }
  if(forced){showFeedback('wrong',feedMsg);}
  else{showFeedback('correct',feedMsgOk);}
  const br=document.getElementById('btn-row'); br.innerHTML='';
  const nb=document.createElement('button'); nb.className='next-btn';
  if(qi<queue.length-1){
    nb.innerHTML='Neste setning <i class="ti ti-arrow-right" style="font-size:15px;vertical-align:-2px"></i>';
    nb.addEventListener('click',()=>{qi++;loadQuestion();});
  } else {nb.textContent='Se resultat'; nb.addEventListener('click',showDone);}
  br.appendChild(nb);
}

function showDone(){
  const TOTAL=MODULES[currentModule].sentences.length;
  const pct=doneCount>0?Math.round((totalPoints/doneCount)*100):0;
  const modLabel=currentModule==='bestemt'?'Bestemt artikkel':currentModule==='ubestemt'?'Ubestemt artikkel':currentModule==='kein'?'kein':currentModule==='poss'?'Eiendomsord':'Personlige pronomen';
  document.getElementById('app').innerHTML=
    '<div class="header"><h1>KasusVeileder</h1></div>'+
    '<div class="done-screen">'+
    '<h2>Oppgaven er fullf\u00f8rt!</h2>'+
    '<p style="color:#6b7280;font-size:14px;margin-bottom:0.25rem">'+modLabel+'</p>'+
    '<div class="done-score">'+fmtPts(totalPoints)+' / '+TOTAL+'</div>'+
    '<p style="color:#4b5563;font-size:15px;margin-bottom:0.25rem">'+doneCount+' setninger gjennomg\u00e5tt \u00b7 '+pct+'% av poeng oppn\u00e5dd</p>'+
    '<p style="color:#4b5563;font-size:15px;margin-bottom:1.5rem">Riktige p\u00e5 f\u00f8rste fors\u00f8k: '+firstTryCount+' av '+doneCount+'</p>'+
    '<table class="result-table"><thead><tr><th>Setning</th><th>Kj\u00f8nn</th><th>Kasus</th></tr></thead><tbody id="result-body"></tbody></table>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
    '<button class="restart-btn" id="restart-btn"><i class="ti ti-refresh"></i> Start p\u00e5 nytt</button>'+
    '<button class="bottom-btn" id="print-btn2"><i class="ti ti-printer"></i> Print til PDF</button>'+
    '</div></div>';
  const tbody=document.getElementById('result-body');
  queue.slice(0,doneCount).forEach(s=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+sentenceWithUnderline(s)+'</td><td>'+GENDER_LABEL[s.gender]+'</td><td>'+KASUS_LABEL[s.kasus]+'</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('restart-btn').addEventListener('click',()=>loadModule(currentModule));
  document.getElementById('print-btn2').addEventListener('click',generatePDF);
}

document.getElementById('module-select').addEventListener('change',function(){loadModule(this.value);});

document.getElementById('overview-btn').addEventListener('click',()=>{
  overviewVisible=!overviewVisible;
  const c=document.getElementById('overview-container');
  if(!overviewVisible){c.innerHTML='';return;}
  const sorted=[...MODULES[currentModule].sentences].sort((a,b)=>a.de.localeCompare(b.de));
  c.innerHTML='<div class="overview-modal"><h3><i class="ti ti-bulb" style="font-size:16px"></i> Alle setninger, alfabetisk</h3><ul class="overview-list">'
    +sorted.map(s=>'<li><span>'+sentenceWithUnderline(s)+'</span><span class="ov-ans">'+(currentModule==='pron'?'':GENDER_LABEL[s.gender]+' \u00b7 ')+s.role+' \u00b7 '+KASUS_LABEL[s.kasus]+'</span></li>').join('')
    +'</ul></div>';
});

document.getElementById('print-btn').addEventListener('click',()=>{ if(doneCount>0){ generatePDF(); } else { alert('Fullfør minst én setning før du lagrer resultatet.'); } });

loadModule('bestemt');
</script>
