<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tysk grammatikk – Artikler og pronomen</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7C9E8A;
    --sage-light: #EAF2ED;
    --sage-mid: #C4DDD0;
    --sage-dark: #3E6650;
    --sage-deep: #1F3D2B;
    --rose: #D4857A;
    --rose-light: #F7EDEB;
    --rose-dark: #8B3D34;
    --sand: #F5F0E8;
    --sand-dark: #E8E0D0;
    --ink: #000000;
    --ink-mid: #111111;
    --ink-light: #333333;
    --white: #FEFEFE;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sand);
    color: var(--ink);
    min-height: 100vh;
    font-size: 17px;
  }

  /* ── HEADER ── */
  header {
    background: var(--sage-deep);
    color: var(--white);
    padding: 1.5rem 2rem 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 2rem;
    letter-spacing: -0.01em;
    color: #D8EDE2;
  }
  header span {
    font-size: 15px;
    color: #7FB89A;
    font-weight: 300;
  }

  /* ── NAV TABS ── */
  .nav-outer {
    background: var(--sage-deep);
    padding: 0 2rem;
    display: flex;
    gap: 0;
    overflow-x: auto;
    border-bottom: 2px solid rgba(255,255,255,0.08);
  }
  .nav-outer::-webkit-scrollbar { height: 3px; }
  .nav-outer::-webkit-scrollbar-thumb { background: var(--sage); border-radius: 2px; }

  .tab-btn {
    background: none;
    border: none;
    color: #7FB89A;
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap;
    transition: color .2s, border-color .2s;
    letter-spacing: 0.01em;
  }
  .tab-btn:hover { color: #D8EDE2; }
  .tab-btn.active {
    color: var(--white);
    border-bottom-color: #7FC8A0;
    font-weight: 500;
  }
  .tab-btn.done { color: #5FAD7A; }

  /* ── MAIN ── */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* ── PAGE TITLE ── */
  .page-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.25rem;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .page-title {
    font-family: 'Fraunces', serif;
    font-size: 1.7rem;
    font-weight: 300;
    color: var(--sage-deep);
    letter-spacing: -0.01em;
  }
  .page-sub {
    font-size: 15px;
    color: var(--ink-light);
    margin-top: 3px;
    font-weight: 300;
  }

  .reset-btn {
    background: none;
    border: 1px solid #CCC;
    border-radius: var(--radius);
    padding: 7px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink-light);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--rose); color: var(--rose-dark); background: var(--rose-light); }

  /* ── PROGRESS ── */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.25rem;
  }
  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--sand-dark);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage) 0%, var(--sage-dark) 100%);
    border-radius: 3px;
    transition: width .4s ease;
  }
  .progress-label {
    font-size: 14px;
    color: var(--ink-light);
    min-width: 100px;
    text-align: right;
  }

  /* ── GRAMMAR TABLE ── */
  .gram-wrap {
    background: var(--white);
    border: 1px solid var(--sand-dark);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }
  .gram-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  .gram-table th {
    background: var(--sage-deep);
    color: #C4DDD0;
    font-weight: 400;
    padding: 9px 12px;
    text-align: left;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .gram-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--sand-dark);
    color: var(--ink);
  }
  .gram-table tr:last-child td { border-bottom: none; }
  .gram-table td:first-child {
    color: var(--ink-light);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: #F9F5EE;
    width: 90px;
  }
  .gram-table td.form {
    color: var(--sage-dark);
    font-weight: 500;
    cursor: default;
  }
  .gram-table td.form:hover { color: var(--sage-deep); }

  /* ── SENTENCES ── */
  .sentences { display: flex; flex-direction: column; gap: 9px; }

  .s-item {
    background: var(--white);
    border: 1px solid var(--sand-dark);
    border-radius: var(--radius);
    padding: 12px 16px;
    transition: border-color .2s, background .2s;
    box-shadow: var(--shadow);
  }
  .s-item.correct { border-color: var(--sage); background: var(--sage-light); }
  .s-item.wrong { border-color: var(--rose); background: var(--rose-light); }

  .s-num {
    font-size: 13px;
    color: var(--ink-light);
    font-weight: 500;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .s-body {
    font-size: 17px;
    line-height: 1.7;
    color: var(--ink);
  }
  .s-trans {
    font-size: 14px;
    color: var(--ink-light);
    font-style: italic;
    margin-top: 5px;
    font-weight: 300;
  }
  .s-pos {
    font-size: 13px;
    color: var(--sage-dark);
    font-weight: 400;
  }

  .de-word {
    cursor: default;
  }

  /* blank placeholder */
  .blank {
    display: inline-block;
    min-width: 44px;
    border-bottom: 2px solid var(--sage);
    color: transparent;
    vertical-align: baseline;
    margin: 0 2px;
  }

  /* click target */
  .target {
    display: inline-block;
    background: var(--sage-mid);
    color: var(--sage-deep);
    border: 1px solid var(--sage);
    border-radius: 5px;
    padding: 1px 7px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }
  .target:hover { background: var(--sage); color: var(--white); }
  .target.answered-correct { background: var(--sage-dark); color: var(--white); border-color: var(--sage-deep); cursor: default; }
  .target.answered-wrong { background: var(--rose); color: var(--white); border-color: var(--rose-dark); cursor: default; }

  /* radio group */
  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 7px;
  }
  .r-label {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border: 1px solid #DDD;
    border-radius: 20px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-mid);
    transition: all .15s;
    user-select: none;
  }
  .r-label:hover { border-color: var(--sage); color: var(--sage-dark); background: var(--sage-light); }
  .r-label input { accent-color: var(--sage-dark); width: 14px; height: 14px; }
  .r-label.correct-opt { border-color: var(--sage-dark); background: var(--sage-light); color: var(--sage-deep); }
  .r-label.wrong-opt { border-color: var(--rose); background: var(--rose-light); color: var(--rose-dark); }

  /* dropdown */
  .s-select {
    border: 1px solid #CCC;
    border-radius: 6px;
    padding: 5px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--sage-dark);
    background: var(--white);
    cursor: pointer;
    transition: border-color .15s;
  }
  .s-select:focus { outline: none; border-color: var(--sage); }
  .s-select.sel-correct { border-color: var(--sage-dark); background: var(--sage-light); color: var(--sage-deep); }
  .s-select.sel-wrong { border-color: var(--rose); background: var(--rose-light); color: var(--rose-dark); }

  /* feedback */
  .feedback {
    display: inline-block;
    font-size: 14px;
    margin-left: 8px;
  }
  .feedback.ok { color: var(--sage-dark); }
  .feedback.no { color: var(--rose-dark); }

  /* ── PREV/NEXT ── */
  .pn-row {
    display: flex;
    gap: 10px;
    margin-top: 1.5rem;
    align-items: center;
  }
  .pn-btn {
    background: none;
    border: 1px solid #CCC;
    border-radius: var(--radius);
    padding: 10px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all .15s;
  }
  .pn-btn:hover { border-color: var(--sage); color: var(--sage-dark); background: var(--sage-light); }
  .pn-btn:disabled { opacity: .35; cursor: not-allowed; }
  .pn-btn.next {
    margin-left: auto;
    background: var(--sage-deep);
    border-color: var(--sage-deep);
    color: var(--white);
    font-weight: 500;
  }
  .pn-btn.next:hover:not(:disabled) { background: var(--sage-dark); border-color: var(--sage-dark); }

  /* ── VICTORY ANIMATIONS ── */
  @keyframes popIn {
    0%{opacity:0;transform:scale(.5)} 100%{opacity:1;transform:scale(1)}
  }
  @keyframes dogeJump {
    0%,100%{transform:translateX(-50%) translateY(0) rotate(-3deg)}
    50%{transform:translateX(-50%) translateY(-22px) rotate(3deg)}
  }
  @keyframes sunPulse {
    0%,100%{box-shadow:0 0 20px #FFD94A66} 50%{box-shadow:0 0 45px #FFD94Acc}
  }
  @keyframes cloudDrift {
    0%{transform:translateX(-120px)} 100%{transform:translateX(600px)}
  }
  @keyframes floatText {
    0%,100%{transform:translateY(0) rotate(-4deg);opacity:.9}
    50%{transform:translateY(-10px) rotate(4deg);opacity:1}
  }
  @keyframes starSpin {
    0%{transform:rotate(0deg) scale(1)} 50%{transform:rotate(180deg) scale(1.3)} 100%{transform:rotate(360deg) scale(1)}
  }
  @keyframes confettiFall {
    0%{top:-20px;opacity:1} 100%{top:110vh;opacity:.3}
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute; background:rgba(255,255,255,.9); border-radius:50%;
  }
  .cloud::before { width:60px;height:35px;top:10px;left:10px; }
  .cloud::after  { width:40px;height:28px;top:18px;left:30px; }
  .cloud { width:90px;height:45px; }

</style>
</head>

const TAB_LABELS = [
  "1a · Best.art. klikk","1b · Best.art. valg",
  "2a · Ubest.art. klikk","2b · Ubest.art. valg",
  "3a · kein klikk","3b · kein valg",
  "4a · Pronomen klikk","4b · Pronomen valg"
];

let cur = 0;
let answers = PAGES.map(p => new Array(p.sents.length).fill(null));

function score(pi){
  let ok=0,done=0;
  answers[pi].forEach((a,i)=>{if(a!==null){done++;if(a===PAGES[pi].sents[i].ans)ok++;}});
  return {ok,done,total:PAGES[pi].sents.length};
}

function buildNav(){
  const nav = document.getElementById('nav-bar');
  nav.innerHTML='';
  PAGES.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===cur?' active':'');
    const sc=score(i);
    if(sc.done>0&&i!==cur) btn.classList.add('done');
    btn.textContent=TAB_LABELS[i];
    btn.onclick=()=>{cur=i;render();};
    nav.appendChild(btn);
  });
}

function gramTable(data){
  let h=`<div class="gram-wrap"><table class="gram-table"><thead><tr>`;
  data.h.forEach(c=>h+=`<th>${c}</th>`);
  h+=`</tr></thead><tbody>`;
  data.r.forEach(row=>{
    h+=`<tr>`;
    row.forEach((cell,ci)=>{
      if(ci===0) h+=`<td>${cell}</td>`;
      else{ h+=`<td class="form">${cell}</td>`; }    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

function sentHTML(p,si){
  const s=p.sents[si];
  const a=answers[p.id][si];
  const done=a!==null;
  const ok=done&&a===s.ans;
  let cls='s-item'+(done?(ok?' correct':' wrong'):'');
  const nounIdx = s.ti+1;

  let opts = [...s.opts];
  // Fixed pseudo-random sequences per page - no repeating cycle
  // Pronomen pages (6-7) keep fixed nom-akk-dat order
  if(p.id <= 5){
    const POS = [
      [1,0,2,0,2,1,2,0,1,2,0,1,0,2,1,0,2], // side 0
      [2,1,0,2,0,1,0,2,1,0,2,0,1,0,2,1,0], // side 1
      [0,2,1,0,1,2,1,0,2,1,0,2,0,1,2,0,1], // side 2
      [1,2,0,1,0,2,0,1,2,0,1,0,2,0,1,2,0], // side 3
      [2,0,1,2,1,0,1,2,0,1,2,1,0,1,2,0,1], // side 4
      [0,1,2,0,2,1,2,0,1,2,0,2,1,2,0,1,2], // side 5
    ];
    const targetPos = POS[p.id][si % POS[p.id].length];
    const correctIdx = opts.indexOf(s.ans);
    if(correctIdx !== -1 && correctIdx !== targetPos){
      opts.splice(correctIdx, 1);
      opts.splice(targetPos, 0, s.ans);
    }
  }

  let body='';
  s.parts.forEach((part,pi)=>{
    if(pi===s.ti){
      if(p.type==='click'){
        if(!done){
          body+=` <span class="blank">___</span>`;
        } else {
          const tcls='target '+(ok?'answered-correct':'answered-wrong');
          body+=` <span class="${tcls}">${a}</span>`;
        }
      } else {
        body+=` <select class="s-select${done?(ok?' sel-correct':' sel-wrong'):''}" onchange="handleDrop(${si},this.value)">`;
        body+=`<option value="">— wähle —</option>`;
        opts.forEach(o=>{ body+=`<option value="${o}" ${a===o?'selected':''}>${o}</option>`; });
        body+=`</select>`;
      }
    } else if(part){
      let w = span(part);
      if(pi===nounIdx && s.g && p.id<=5){
        w += `<em style="font-size:11px;color:var(--ink-light);font-style:italic;margin-left:1px;">(${s.g})</em>`;
      }
      body+=' '+w;
    }
  });

  let extra='';
  if(p.type==='click'&&!done){
    extra=`<div class="radio-group">`;
    opts.forEach(o=>{ extra+=`<label class="r-label"><input type="radio" name="r${p.id}_${si}" value="${o}" onchange="handleClick(${si},'${o}')">${o}</label>`; });
    extra+=`</div>`;
  }
  if(done){
    const kasusMap = {'nom':'nominativ','akk':'akkusativ','dat':'dativ'};
    let kasus = '';
    if(s.pos){
      const first = s.pos.split(/[\s.]/)[0].trim().toLowerCase();
      kasus = kasusMap[first] || '';
    }
    const kasusSpan = kasus ? ` <span style="font-size:11px;color:var(--ink-light);font-weight:400;">(${kasus})</span>` : '';
    if(ok) extra+=`<span class="feedback ok">✓ Riktig${kasusSpan}</span>`;
    else extra+=`<span class="feedback no">✗ Feil — riktig: <strong>${s.ans}</strong>${kasusSpan}</span>`;
  }

  return `<div class="${cls}">
    <div class="s-num">Setning ${si+1}</div>
    <div class="s-body">${body}${extra?'  '+extra:''}</div>
    <div class="s-trans">${s.t[0]}</div>
  </div>`;
}

function renderPage(){
  if(cur===WELCOME_IDX){ renderWelcome(); return; }
  if(cur===VICTORY_IDX){ renderVictory(); return; }
  const p=PAGES[cur];
  const sc=score(cur);
  const pct=Math.round(sc.done/sc.total*100);
  let html=`<div class="page-title-row">
    <div><div class="page-title">${p.title}</div><div class="page-sub">${p.sub}</div></div>
    <button class="reset-btn" onclick="resetPage()">Nullstill side</button>
  </div>
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Svart ${sc.done}/${sc.total}${sc.done?` · Riktige ${sc.ok}`:''}</div>
  </div>`;
  html+=gramTable(p.table);
  html+=`<div class="sentences">`;
  p.sents.forEach((_,i)=>html+=sentHTML(p,i));
  html+=`</div>`;
  html+=`<div class="pn-row">
    ${cur>0?`<button class="pn-btn" onclick="go(-1)">← Forrige</button>`:''}
    <button class="pn-btn next" onclick="go(1)">${cur===PAGES.length-1?'Se resultatet 🎉':'Neste →'}</button>
  </div>`;
  document.getElementById('page-root').innerHTML=html;
}

function buildNav(){
  const nav = document.getElementById('nav-bar');
  nav.innerHTML='';
  // welcome tab
  const wbtn=document.createElement('button');
  wbtn.className='tab-btn'+(cur===WELCOME_IDX?' active':'');
  wbtn.textContent='👋 Start';
  wbtn.onclick=()=>{cur=WELCOME_IDX;render();};
  nav.appendChild(wbtn);
  PAGES.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===cur?' active':'');
    const sc=score(i);
    if(sc.done>0&&i!==cur) btn.classList.add('done');
    btn.textContent=TAB_LABELS[i];
    btn.onclick=()=>{cur=i;render();};
    nav.appendChild(btn);
  });
  // victory tab
  const vbtn=document.createElement('button');
  vbtn.className='tab-btn'+(cur===VICTORY_IDX?' active':'');
  vbtn.textContent='🏆 Resultat';
  vbtn.onclick=()=>{cur=VICTORY_IDX;render();};
  nav.appendChild(vbtn);
}

function render(){ buildNav(); renderPage(); }
function handleClick(si,val){ answers[cur][si]=val; render(); }
function handleDrop(si,val){ if(!val)return; answers[cur][si]=val; render(); }
function go(d){ cur=Math.max(WELCOME_IDX,Math.min(VICTORY_IDX,cur+d)); render(); }
function resetPage(){ if(cur===VICTORY_IDX||cur===WELCOME_IDX)return; answers[cur]=new Array(PAGES[cur].sents.length).fill(null); render(); }
function restartAll(){ answers=PAGES.map(p=>new Array(p.sents.length).fill(null)); cur=WELCOME_IDX; render(); }

function startConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  if(!canvas) return;
  const W=window.innerWidth, H=window.innerHeight;
  canvas.innerHTML='';
  const colors=['#7C9E8A','#D4857A','#FFD94A','#5a7ae0','#9b5ae0','#5ab870','#e0a030'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    const size=Math.random()*10+6;
    const x=Math.random()*100;
    const delay=Math.random()*3;
    const dur=Math.random()*3+3;
    const color=colors[Math.floor(Math.random()*colors.length)];
    const rotate=Math.random()*360;
    el.style.cssText=`position:absolute;left:${x}%;top:-20px;width:${size}px;height:${size}px;background:${color};border-radius:${Math.random()>0.5?'50%':'2px'};animation:confettiFall ${dur}s linear ${delay}s infinite;transform:rotate(${rotate}deg);opacity:.85;`;
    canvas.appendChild(el);
  }
}
